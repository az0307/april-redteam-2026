name: Red Team Stack CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ── Validate docker-compose ────────────────────────────────
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "✓ docker-compose.yml valid"

  # ── Lint shell scripts ────────────────────────────────────
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: |
          find scripts/ kali-mcp/ -name "*.sh" -print0 | \
            xargs -0 shellcheck --severity=warning
          echo "✓ All shell scripts pass shellcheck"

  # ── Validate JSON configs ─────────────────────────────────
  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate claude.json
        run: |
          python3 -c "
          import json, sys
          files = ['claude.json']
          for f in files:
              try:
                  with open(f) as fp:
                      json.load(fp)
                  print(f'✓ {f} valid JSON')
              except json.JSONDecodeError as e:
                  print(f'✗ {f}: {e}', file=sys.stderr)
                  sys.exit(1)
          "
      - name: Validate grafana dashboard JSON
        run: |
          python3 -c "
          import json, glob, sys
          for f in glob.glob('grafana/**/*.json', recursive=True):
              try:
                  json.load(open(f))
                  print(f'✓ {f}')
              except Exception as e:
                  print(f'✗ {f}: {e}', file=sys.stderr)
                  sys.exit(1)
          "

  # ── Secret scanning ───────────────────────────────────────
  secret-scan:
    name: Scan for Committed Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      - name: Scan every tracked file for secrets and engagement data
        run: python3 ci/check_secrets.py

  # ── Validate YAML configs ─────────────────────────────────
  validate-yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Validate YAML files
        run: |
          yamllint -d relaxed docker-compose.yml litellm_config.yaml \
            grafana/provisioning/datasources/prometheus.yml \
            grafana/provisioning/dashboards/dashboards.yml \
            docs/prometheus.yml
          echo "✓ All YAML files valid"

  # ── Check playbook structure ──────────────────────────────
  validate-playbooks:
    name: Validate Playbook Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all playbooks have required sections
        run: |
          python3 << 'PYEOF'
          import os, sys
          errors = []
          playbook_dir = "playbooks"
          required_sections = ["PHASE", "Evidence"]

          for fname in os.listdir(playbook_dir):
              if not fname.endswith(".md"):
                  continue
              path = os.path.join(playbook_dir, fname)
              content = open(path).read()
              for section in required_sections:
                  if section not in content:
                      errors.append(f"{fname}: missing '{section}'")

          if errors:
              print("Playbook validation errors:")
              for e in errors:
                  print(f"  ✗ {e}")
              sys.exit(1)
          else:
              print(f"✓ All {len(os.listdir(playbook_dir))} playbooks valid")
          PYEOF

  # ── Python syntax check ───────────────────────────────────
  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python files
        run: |
          find . -name "*.py" -not -path "./.git/*" | while read f; do
            python3 -m py_compile "$f" && echo "✓ $f" || exit 1
          done

  # ── Makefile targets ──────────────────────────────────────
  validate-makefile:
    name: Validate Makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Makefile syntax
        run: |
          make --dry-run help
          echo "✓ Makefile parses correctly"

  # ── Kali MCP unit tests ───────────────────────────────────
  test-kali-mcp:
    name: Kali MCP Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r kali-mcp/requirements.txt pytest
      - name: Run tests
        run: |
          cd kali-mcp && python3 -m pytest -q

  test-ci-safety:
    name: CI Safety Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install PyYAML
      - name: Test CI failure handling and safe mission paths
        run: python3 -m unittest discover -s tests -v

  # ── Summary ───────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs:
      - validate-compose
      - lint-scripts
      - validate-json
      - secret-scan
      - validate-yaml
      - validate-playbooks
      - python-syntax
      - validate-makefile
      - test-kali-mcp
      - test-ci-safety
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [name for name, job in needs.items()
                    if job.get("result") != "success"]
          if not needs or failed:
              print("CI failed or incomplete: " + ", ".join(failed))
              sys.exit(1)
          print("All required CI jobs passed")
          PYEOF
